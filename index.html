<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Please say yes</title>
<style>
  :root{--bg:#ffe3ec;--card:#fff7fa;--ink:#3a1030;--yes:#ff3d7f;--no:#6b5b8a}
  *,*::before,*::after{box-sizing:border-box}
  body{margin:0;height:100vh;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS",system-ui,sans-serif;overflow:hidden}
  .page{min-height:100%;display:grid;place-items:center;padding:16px}
  .card{position:relative;width:min(560px,100%);background:var(--card);border-radius:32px;padding:36px 24px 32px;text-align:center;box-shadow:0 10px 0 var(--yes)}
  .face{font-size:88px;line-height:1;display:inline-block;animation:bob 1.6s ease-in-out infinite}
  h1{font-size:clamp(28px,6vw,40px);margin:12px 0 6px;line-height:1.15}
  .plea{min-height:1.6em;margin:0 0 22px;font-size:18px;opacity:.85}
  .buttons{display:flex;gap:16px;justify-content:center;align-items:center;min-height:96px;flex-wrap:wrap}
  button{font:inherit;font-weight:700;border:0;cursor:pointer;border-radius:999px;color:#fff;background:var(--no);padding:12px 28px;font-size:20px}
  #yes{background:var(--yes);font-size:22px;padding:14px 34px;position:relative;z-index:5;transition:font-size .25s ease,padding .25s ease}
  #yes.full{position:fixed;inset:0;border-radius:0;font-size:min(18vw,160px);z-index:50;padding:0;display:grid;place-items:center}
  #no{z-index:20;white-space:nowrap;transition:left .3s ease,top .3s ease}
  #no.run{position:fixed}
  .beg{position:absolute;font-size:34px;pointer-events:none;animation:plead 1.1s ease-in-out infinite}
  .beg.a{left:6%;top:56%}
  .beg.b{right:6%;top:56%;animation-delay:.25s}
  .beg.c{left:18%;top:8%;animation-delay:.5s}
  .beg.d{right:18%;top:8%;animation-delay:.75s}
  .fly{position:fixed;font-size:32px;pointer-events:none;z-index:10;animation:plead 1.2s ease-in-out infinite}
  .win{position:fixed;inset:0;display:none;place-items:center;text-align:center;background:var(--bg);z-index:100;padding:24px}
  .win.on{display:grid}
  .win h2{font-size:clamp(36px,9vw,72px);margin:0}
  .conf{position:fixed;top:-50px;font-size:30px;pointer-events:none;z-index:101;animation:fall linear forwards}
  @keyframes bob{50%{transform:translateY(-10px) rotate(-4deg)}}
  @keyframes plead{0%,100%{transform:translateY(0) scale(1) rotate(-8deg)}50%{transform:translateY(-12px) scale(1.18) rotate(8deg)}}
  @keyframes fall{to{transform:translateY(115vh) rotate(540deg)}}
</style>
</head>
<body>
<div class="page">
  <div class="card">
    <span class="beg a">🥺</span><span class="beg b">🙏</span>
    <span class="beg c">💖</span><span class="beg d">😭</span>
    <div class="face" id="face">🙂</div>
    <h1>Wanna Hangout?</h1>
    <p class="plea" id="plea">quality time ta love🥺…</p>
    <div class="buttons">
      <button id="yes">Yes 💚</button>
      <button id="no">No</button>
    </div>
  </div>
</div>

<div class="win" id="win">
  <div><div style="font-size:96px">🥳</div><h2>Yaaay! 🎉</h2><p>kanus-a mn? free raka nig Nov. 21?</p></div>
</div>

<script>
  const yes = document.getElementById("yes");
  const no = document.getElementById("no");
  const face = document.getElementById("face");
  const plea = document.getElementById("plea");
  const win = document.getElementById("win");

  let tries = 0, flyCount = 0;
  const faces = ["🙂","🥺","🥺","😢","😭","😭","🙏","😫","💔"];
  const noText = ["No"];
  const pleas = ["Choose carefully…","Yes na loveyy 🥺","I’ll be so sad…","I’ll buy foods!","I’ll buy your cravings","loveyy imissyouu na","yes na love, daku na ang yess ohh!","Just click the big one 😭"];
  const begEmoji = ["🥺","🙏","😭","💖","🐶","💐","🍫","😢"];

  const rand = (min, max) => Math.random() * (max - min) + min;

  // The No button only moves when it is CLICKED
  no.addEventListener("click", () => {
    tries++;
    no.classList.add("run");
    const x = rand(8, Math.max(9, window.innerWidth - no.offsetWidth - 8));
    const y = rand(8, Math.max(9, window.innerHeight - no.offsetHeight - 8));
    no.style.left = x + "px";
    no.style.top = y + "px";
    no.textContent = noText[Math.min(tries, noText.length - 1)];

    growYes();
    face.textContent = faces[Math.min(tries, faces.length - 1)];
    plea.textContent = pleas[Math.min(tries, pleas.length - 1)];
    spawnBeggar();
  });

  function growYes() {
    if (tries >= 9) {
      yes.classList.add("full");
      yes.style.fontSize = "";
      yes.style.padding = "";
      return;
    }
    yes.style.fontSize = (22 + tries * 9) + "px";
    yes.style.padding = (14 + tries * 3) + "px " + (34 + tries * 8) + "px";
  }

  function spawnBeggar() {
    if (flyCount >= 36) return;
    flyCount++;
    const s = document.createElement("span");
    s.className = "fly";
    s.textContent = begEmoji[Math.floor(Math.random() * begEmoji.length)];
    s.style.left = rand(2, 92) + "vw";
    s.style.top = rand(4, 88) + "vh";
    s.style.animationDelay = rand(0, 1) + "s";
    document.body.appendChild(s);
  }

  yes.addEventListener("click", () => {
    win.classList.add("on");
    const set = ["🎉","💖","✨","🥳","💚","🎈"];
    for (let i = 0; i < 70; i++) {
      const c = document.createElement("span");
      c.className = "conf";
      c.textContent = set[i % set.length];
      c.style.left = rand(0, 98) + "vw";
      c.style.animationDuration = rand(2, 4.5) + "s";
      c.style.animationDelay = rand(0, 1.5) + "s";
      document.body.appendChild(c);
    }
  });
</script>
</body>
</html>
